<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quiz de Capitais</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 32px 40px;
            max-width: 420px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #2a5298;
        }
        .pergunta {
            margin-bottom: 24px;
            padding: 16px;
            border-radius: 10px;
            background: #f4f8fb;
            box-shadow: 0 1px 4px rgba(42,82,152,0.05);
            display: none;
        }
        .pergunta.ativa {
            display: block;
        }
        .pergunta p {
            margin: 0 0 10px 0;
            font-weight: bold;
            color: #2a5298;
        }
        label {
            display: block;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        input[type="radio"] {
            accent-color: #2a5298;
            margin-right: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #2a5298, #1e3c72);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: linear-gradient(90deg, #1e3c72, #2a5298);
        }
        .resultado {
            font-weight: bold;
            margin-top: 24px;
            text-align: center;
            font-size: 1.1rem;
            color: #1e3c72;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>QUIZ</h2>
        <p style="text-align:center;">Vamos testar seus conhecimentos sobre capitais do mundo!</p>
        <form id="quizForm" onsubmit="return false;">
            <div class="pergunta ativa" id="pergunta1">
                <p>1. Qual a capital do Brasil?</p>
                <label><input type="radio" name="q1" value="A">A) São Paulo</label>
                <label><input type="radio" name="q1" value="B">B) Salvador</label>
                <label><input type="radio" name="q1" value="C">C) Brasília</label>
                <label><input type="radio" name="q1" value="D">D) Rio de Janeiro</label>
                <button type="button" onclick="proximaPergunta(1)">Próxima</button>
            </div>
            <div class="pergunta" id="pergunta2">
                <p>2. Qual a capital da França?</p>
                <label><input type="radio" name="q2" value="A">A) Berlim</label>
                <label><input type="radio" name="q2" value="B">B) Paris</label>
                <label><input type="radio" name="q2" value="C">C) Madrid</label>
                <label><input type="radio" name="q2" value="D">D) Lisboa</label>
                <button type="button" onclick="proximaPergunta(2)">Próxima</button>
            </div>
            <div class="pergunta" id="pergunta3">
                <p>3. Qual a capital do Japão?</p>
                <label><input type="radio" name="q3" value="A">A) Seul</label>
                <label><input type="radio" name="q3" value="B">B) Pequim</label>
                <label><input type="radio" name="q3" value="C">C) Tóquio</label>
                <label><input type="radio" name="q3" value="D">D) Bangcoc</label>
                <button type="button" onclick="proximaPergunta(3)">Próxima</button>
            </div>
            <div class="pergunta" id="pergunta4">
                <p>4. Qual a capital da Itália?</p>
                <label><input type="radio" name="q4" value="A">A) Roma</label>
                <label><input type="radio" name="q4" value="B">B) Atenas</label>
                <label><input type="radio" name="q4" value="C">C) Milão</label>
                <label><input type="radio" name="q4" value="D">D) Turim</label>
                <button type="button" onclick="proximaPergunta(4)">Próxima</button>
            </div>
            <div class="pergunta" id="pergunta5">
                <p>5. Qual a capital da Alemanha?</p>
                <label><input type="radio" name="q5" value="A">A) Viena</label>
                <label><input type="radio" name="q5" value="B">B) Berlim</label>
                <label><input type="radio" name="q5" value="C">C) Hamburgo</label>
                <label><input type="radio" name="q5" value="D">D) Munique</label>
                <button type="button" onclick="corrigirQuiz()">Enviar</button>
            </div>
        </form>
        <div class="resultado" id="resultado"></div>
    </div>
    <script>
        function proximaPergunta(atual) {
            const radios = document.querySelectorAll(`#pergunta${atual} input[type=radio]`);
            let marcada = false;
            radios.forEach(r => { if (r.checked) marcada = true; });
            if (!marcada) {
                alert('Por favor, selecione uma resposta antes de continuar.');
                return;
            }
            document.getElementById('pergunta'+atual).classList.remove('ativa');
            document.getElementById('pergunta'+(atual+1)).classList.add('ativa');
        }
        function corrigirQuiz() {
            const radios = document.querySelectorAll(`#pergunta5 input[type=radio]`);
            let marcada = false;
            radios.forEach(r => { if (r.checked) marcada = true; });
            if (!marcada) {
                alert('Por favor, selecione uma resposta antes de continuar.');
                return;
            }
            document.getElementById('pergunta5').classList.remove('ativa');
            const respostasCorretas = ['C', 'B', 'C', 'A', 'B'];
            let pontos = 0;
            for (let i = 1; i <= 5; i++) {
                const resposta = document.querySelector('input[name="q'+i+'"]:checked');
                if (resposta && resposta.value === respostasCorretas[i-1]) {
                    pontos++;
                }
            }
            let mensagem = `Você fez ${pontos} pontos no total!`;
            if (pontos >= 4) {
                mensagem += '<br>Parabéns! Você tem um ótimo conhecimento sobre capitais do mundo!';
            } else {
                mensagem += '<br>Continue estudando para melhorar seu conhecimento sobre capitais do mundo!';
            }
            document.getElementById('resultado').innerHTML = mensagem;
        }
    </script>
</body>
</html>
